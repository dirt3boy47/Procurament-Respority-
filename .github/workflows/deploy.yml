name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    # Deploys the t2w-procurement Worker on every push to main, or from any
    # branch when run by hand (Actions -> Test and deploy -> Run workflow).
    # Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit)
    # and CLOUDFLARE_ACCOUNT_ID.
    needs: test
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip - Cloudflare secrets not set
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys."
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_TOKEN == 'true'
      - name: Deploy Worker
        if: env.HAS_TOKEN == 'true'
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Describe the secrets without ever printing them, and strip stray
          # whitespace / line breaks picked up when pasting.
          describe() {
            local name="$1" value="$2"
            local lines; lines=$(printf '%s' "$value" | awk 'NF' | wc -l)
            local clean; clean=$(printf '%s' "$value" | tr -d '[:space:]')
            local ok=yes; [[ "$clean" =~ ^[A-Za-z0-9_-]+$ ]] || ok=no
            echo "$name: ${#clean} chars after trimming, $lines non-empty line(s), only token characters: $ok"
          }
          describe CLOUDFLARE_API_TOKEN "$RAW_TOKEN"
          describe CLOUDFLARE_ACCOUNT_ID "$RAW_ACCOUNT"
          token_lines=$(printf '%s' "$RAW_TOKEN" | awk 'NF' | wc -l)
          if [ "$token_lines" -ne 1 ]; then
            echo "::error::CLOUDFLARE_API_TOKEN must contain only the token on a single line (it has $token_lines lines). Re-save the secret with just the token."
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          export CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be the 32-character Account ID from the Cloudflare dashboard."
            exit 1
          fi
          npx wrangler deploy
